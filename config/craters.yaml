    centre_source_url: https://en.wikipedia.org/wiki/Tenoumer_crater
  - id: tswaing
    name: Tswaing (formerly Pretoria Saltpan)
    region_id: crater_tswaing
    diameter_km: 1.13
    age_ma: "0.220 ± 0.052"
