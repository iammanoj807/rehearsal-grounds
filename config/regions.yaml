# Earth regions indexed by the pipeline.
#
# lat/lon is the box centre, copied from the cited source (retrieved 2026-11-14).
# Wikipedia values come from the article's GeoData coordinates
# (https://en.wikipedia.org/w/api.php?action=query&prop=coordinates).
# set: well_studied (validation set), discovery (less-studied candidates),
#      crater_benchmark (V1 crater retrieval tiles).
# half_km: optional box half-size; defaults to region_half_km or crater_half_km
#          in pipeline.yaml.

regions:
  # ---------------- Well-studied analogs (validation set) ----------------
  - id: meteor_crater
    name: Meteor Crater, Arizona
    country: United States
    set: well_studied
    lat: 35.02805556
    lon: -111.02333333
    source_url: https://en.wikipedia.org/wiki/Meteor_Crater
