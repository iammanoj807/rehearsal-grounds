# Rehearsal Grounds pipeline settings. Every script reads this file.
resolution_m: 60          # common grid for every body
patch_px: 64              # 64 x 60 m = 3.84 km window
display_resolution_m: 30  # pictures only: patch images are drawn from the original maps at 30 m; every score uses resolution_m
stride_px: 32             # 50% overlap
min_valid_fraction: 0.95  # drop patches with more nodata
mask_max_veg_built_crop: 0.20   # share of WorldCover 10,40,50,90,95 (trees, crops, built-up, wetland, mangrove),
                                # plus 20,30,100 (shrub, grass, moss) where annual rainfall > mask_sparse_veg_humid_mm
mask_sparse_veg_humid_mm: 500   # mm/yr; upper bound of semiarid rainfall (USGS desert primer, Meigs classification)
mask_max_snow_ice: 0.50        # WorldCover class 70 (snow and ice)
mask_max_water: 0.05            # WorldCover class 80
min_relief_m: 5           # drop near-flat patches (sea, lakes, salt pans) from the analog search
top_k_sites: 50
nms_km: 10                # keep matches at least 10 km apart
novelty_km: 50            # within this distance of a catalogued analog -> well studied
env_radius_km: 2          # land-cover fractions around each site
weights: {morph: 0.6, embed: 0.4}
seed: 42

# Earth region extraction: a square box centred on the cited region centre.
region_half_km: 50        # 100 km x 100 km box per analog region
crater_half_km: 30        # 60 km x 60 km box per crater benchmark tile

# Fast smoke run used by `make pipeline-small` (1 target, 2 regions).
small:
  targets: [moon_site23_malapert]
  regions: [meteor_crater, tibesti]

# Per-profile overrides (selected with RG_PROFILE). The 90 m robustness
# rerun keeps the physical window close to 3.84 km (43 x 90 m = 3.87 km).
profiles:
  res90: {resolution_m: 90, patch_px: 43, stride_px: 21}
