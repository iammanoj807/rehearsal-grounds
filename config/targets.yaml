# Moon and Mars target sites.
#
# Moon: NASA GSFC PGDA "South Pole Landing Site LOLA DEMs" (product 78),
# 5 m/pix GeoTIFFs in south polar stereographic metres. Cite Barker et al.
# 2021, Planetary and Space Science 203, 105119,
# https://doi.org/10.1016/j.pss.2020.105119. Site names follow PGDA and
# Mazarico et al. 2011, Icarus 211, 1066-1081.
# Mars: USGS Astrogeology Mars 2020 TRN CTX DTM mosaic (CC0), cite
# Fergason et al. 2020, https://doi.org/10.5066/P906QQT8.
# The two last targets were stretch items, switched on after the MVP was complete.
#
# artemis_iii_region: set only when the PGDA site name matches a region named in
# NASA's 28 October 2024 release (https://www.nasa.gov/news-release/nasa-provides-update-on-artemis-iii-moon-landing-regions/).
# Site11 "de Gerlache rim" is left unlabelled: NASA lists "de Gerlache Rim 2" and
# PGDA does not number its site, so the match is ambiguous.

artemis_iii:
  source_url: https://www.nasa.gov/news-release/nasa-provides-update-on-artemis-iii-moon-landing-regions/
  release_date: '2024-10-28'
  regions: [Peak near Cabeus B, Haworth, Malapert Massif, Mons Mouton Plateau, Mons Mouton, Nobile Rim 1,
            Nobile Rim 2, de Gerlache Rim 2, Slater Plain]

targets:
  - id: moon_site23_malapert
    name: Malapert massif
    body: moon
    enabled: true
    artemis_iii_region: Malapert Massif
    url: https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/Site23/Site23_final_adj_5mpp_surf.tif
    product_url: https://pgda.gsfc.nasa.gov/products/78
    description: >-
      PGDA landing-site DEM Site23, Malapert massif. NASA listed Malapert
      Massif among nine candidate Artemis III landing regions near the lunar
      south pole (NASA release, 28 October 2024).
    description_source_url: https://www.nasa.gov/news-release/nasa-provides-update-on-artemis-iii-moon-landing-regions/
    citation: Barker, M.K. et al. (2021) Planetary and Space Science 203, 105119. doi:10.1016/j.pss.2020.105119
    data_note: PGDA states Site23 does not yet have error estimates or clones.
  - id: moon_site04_shackleton_rim
    name: Shackleton crater rim
    body: moon
    enabled: true
    url: https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/Site04/Site04_final_adj_5mpp_surf.tif
    product_url: https://pgda.gsfc.nasa.gov/products/78
    description: >-
      PGDA landing-site DEM Site04, on the rim of Shackleton crater at the
      lunar south pole.
    description_source_url: https://pgda.gsfc.nasa.gov/products/78
    citation: Barker, M.K. et al. (2021) Planetary and Space Science 203, 105119. doi:10.1016/j.pss.2020.105119
  - id: moon_site01_connecting_ridge
    name: Connecting ridge
    body: moon
    enabled: true
    url: https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/Site01/Site01_final_adj_5mpp_surf.tif
    product_url: https://pgda.gsfc.nasa.gov/products/78
    description: >-
      PGDA landing-site DEM Site01, "Connecting ridge", one of the LOLA
      south pole landing-site DEMs.
    description_source_url: https://pgda.gsfc.nasa.gov/products/78
    citation: Barker, M.K. et al. (2021) Planetary and Space Science 203, 105119. doi:10.1016/j.pss.2020.105119
  - id: mars_jezero
    name: Jezero crater (landing area and delta)
    body: mars
    enabled: true
    url: https://planetarymaps.usgs.gov/mosaic/mars2020_trn/CTX/JEZ_ctx_B_soc_008_DTM_MOLAtopography_DeltaGeoid_20m_Eqc_latTs0_lon0.tif
    product_url: https://astrogeology.usgs.gov/search/map/mars_2020_terrain_relative_navigation_ctx_dtm_mosaic
    description: >-
      CTX terrain model of the Mars 2020 landing area in Jezero crater, built
      for Perseverance's terrain-relative navigation. It covers about
      32 km x 30 km.
    description_source_url: https://astrogeology.usgs.gov/search/map/mars_2020_terrain_relative_navigation_ctx_dtm_mosaic
    citation: Fergason, R.L. et al. (2020) Mars 2020 Terrain Relative Navigation CTX DTM Mosaic. USGS Astrogeology Science Center. doi:10.5066/P906QQT8
    licence: CC0
  # ---- Stretch targets (enable after the MVP deploys) ----
  - id: moon_site11_de_gerlache_rim
    name: de Gerlache crater rim
    body: moon
    enabled: true
    url: https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/Site11/Site11_final_adj_5mpp_surf.tif
    product_url: https://pgda.gsfc.nasa.gov/products/78
    description: >-
      PGDA landing-site DEM Site11, "de Gerlache rim", one of the LOLA
      south pole landing-site DEMs.
    description_source_url: https://pgda.gsfc.nasa.gov/products/78
    citation: Barker, M.K. et al. (2021) Planetary and Space Science 203, 105119. doi:10.1016/j.pss.2020.105119
  - id: moon_site20_leibnitz_beta
    name: Leibnitz beta plateau
    body: moon
    enabled: true
    url: https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/Site20/Site20_final_adj_5mpp_surf.tif
    product_url: https://pgda.gsfc.nasa.gov/products/78
    description: >-
      PGDA landing-site DEM Site20, "Leibnitz beta plateau", one of the LOLA
      south pole landing-site DEMs.
    description_source_url: https://pgda.gsfc.nasa.gov/products/78
    citation: Barker, M.K. et al. (2021) Planetary and Space Science 203, 105119. doi:10.1016/j.pss.2020.105119
  # ---- Artemis III candidate regions with a PGDA LOLA 5 m DEM (added 14 Nov, phase 1) ----
  - id: moon_haworth
    name: Haworth
    body: moon
    enabled: true
    artemis_iii_region: Haworth
    url: https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/Haworth/Haworth_final_adj_5mpp_surf.tif
    product_url: https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/
    description: >-
      PGDA landing-site DEM "Haworth". NASA listed Haworth among nine candidate
      Artemis III landing regions near the lunar south pole (NASA release,
      28 October 2024).
    description_source_url: https://www.nasa.gov/news-release/nasa-provides-update-on-artemis-iii-moon-landing-regions/
    citation: Barker, M.K. et al. (2021) Planetary and Space Science 203, 105119. doi:10.1016/j.pss.2020.105119
  - id: moon_site06_nobile_rim_1
    name: Nobile rim 1
    body: moon
    enabled: true
    artemis_iii_region: Nobile Rim 1
    url: https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/Site06/Site06_final_adj_5mpp_surf.tif
    product_url: https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/
    description: >-
      PGDA landing-site DEM Site06, "Nobile rim 1". NASA listed Nobile Rim 1
      among nine candidate Artemis III landing regions near the lunar south pole
      (NASA release, 28 October 2024).
    description_source_url: https://www.nasa.gov/news-release/nasa-provides-update-on-artemis-iii-moon-landing-regions/
    citation: Barker, M.K. et al. (2021) Planetary and Space Science 203, 105119. doi:10.1016/j.pss.2020.105119
  - id: moon_dm2_nobile_rim_2
    name: Nobile rim 2
    body: moon
    enabled: true
    artemis_iii_region: Nobile Rim 2
    url: https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/DM2/DM2_final_adj_5mpp_surf.tif
    product_url: https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/
    description: >-
      PGDA landing-site DEM "DM2", named "Nobile rim 2" in the PGDA README. NASA
      listed Nobile Rim 2 among nine candidate Artemis III landing regions near
      the lunar south pole (NASA release, 28 October 2024).
    description_source_url: https://www.nasa.gov/news-release/nasa-provides-update-on-artemis-iii-moon-landing-regions/
    citation: Barker, M.K. et al. (2021) Planetary and Space Science 203, 105119. doi:10.1016/j.pss.2020.105119
